<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#101a27" />
  <title>Scrapshot Showdown</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Scrapshot Showdown home"><span class="brand-mark">✦</span><span>SCRAPSHOT <b>SHOWDOWN</b></span></a>
      <div class="top-note"><span class="live-dot"></span> ARCADE PLAYGROUND <span class="divider">/</span> SOLO SHOWDOWN</div>
      <button id="soundBtn" class="sound-btn" aria-label="Toggle sound">♫ <span>Sound on</span></button>
    </header>
    <section class="game-wrap" aria-label="Scrapshot Showdown game">
      <canvas id="game" width="1200" height="720" aria-label="2D arena game. Choose a brawler, then use WASD and your mouse to battle."></canvas>
      <div class="canvas-glow"></div>
    </section>
    <footer class="footer"><span>10 UNIQUE BRAWLERS</span><i></i><span>ONE TINY ARENA</span><i></i><span>ABSOLUTE MAYHEM</span><span class="footer-right">A tiny top-down arena shooter</span></footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
